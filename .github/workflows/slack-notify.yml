name: GTM Slack notifier

# Posts campaign start/finish alerts to Slack once a day.
# See scripts/notify-slack.mjs for the logic.
on:
  schedule:
    # 01:07 UTC — about 03:07 in Madrid (02:07 once winter time starts; the
    # cron is fixed in UTC, so the local hour shifts with DST. The script
    # itself always resolves "today" in Europe/Madrid, so only the trigger
    # moves, never the dates it compares.)
    #
    # WHY SO EARLY, when the aim is a 09:00-ish Slack post:
    # GitHub queues scheduled workflows on free public repos at the lowest
    # priority, so a cron time is "no earlier than", never a promise. Measured
    # over 29 runs of the old 07:05 UTC slot: median 5.5h late, p90 8.5h,
    # worst 12.3h — every single run landed in the afternoon (13:14–21:23
    # Madrid), which is useless for "this campaign goes live today".
    #
    # Scheduling early absorbs that delay instead of fighting it. Same delay
    # distribution from 01:07 UTC puts delivery at ~08:37 Madrid (median) and
    # 15:25 at the very worst, versus 14:35 / 21:23 before. The odd minute and
    # the off-peak hour both help on their own: congestion is heaviest on the
    # hour and during EU/US working hours, which is what GitHub's own docs
    # advise avoiding.
    #
    # It also widens a safety margin. todayStr() resolves the date in Madrid
    # AT RUN TIME, so a run delayed past Madrid midnight (22:00 UTC in summer,
    # 23:00 in winter) would evaluate the WRONG day — and since each event
    # fires on an exact date match with no "already notified" flag, those
    # alerts would be lost rather than late, with nothing to warn anyone. From
    # 07:05 UTC that cliff was 14.9h away; from 01:07 UTC it's 20.9h.
    #
    # Trade-off accepted: an early run can't see same-day edits. Paint a
    # Briefing Deadline at 09:00 and it's picked up by the next day's run.
    - cron: "7 1 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab to test

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed only by the keepalive step below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Send Slack notifications
        env:
          SLACK_WEBHOOK_ES: ${{ secrets.SLACK_WEBHOOK_ES }}
          SLACK_WEBHOOK_IT: ${{ secrets.SLACK_WEBHOOK_IT }}
          LEAD_DAYS: "3"
        run: node scripts/notify-slack.mjs

      # ── KEEPALIVE ───────────────────────────────────────────────────────
      # GitHub switches scheduled workflows on PUBLIC repos to
      # "disabled_inactivity" after 60 days with no repo activity. That
      # silently killed this job once: last commit 2026-07-06, so the cron
      # stopped on 2026-09-05 and nobody noticed for 17 days (~11 missed
      # alerts). Re-enabling by hand only buys another 60 quiet days.
      #
      # So: if the newest commit is older than KEEPALIVE_DAYS, push an empty
      # commit to reset GitHub's clock. "[skip netlify]" keeps Netlify from
      # rebuilding the site over a no-op commit. Normal development already
      # resets the clock, so this only fires when the repo goes quiet.
      #
      # `always()` on purpose: the keepalive is the safety net, so a Slack or
      # Supabase failure above must not also stop the schedule staying alive.
      - name: Keepalive (reset GitHub's 60-day inactivity clock)
        if: always() && github.event_name == 'schedule'
        env:
          KEEPALIVE_DAYS: "45"   # comfortably inside GitHub's 60-day limit
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Newest commit is ${age} day(s) old (keepalive threshold: ${KEEPALIVE_DAYS})."
          if [ "$age" -lt "$KEEPALIVE_DAYS" ]; then
            echo "Repo is active — no keepalive needed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive: keep the Slack notifier schedule alive [skip netlify]"
          git push
          echo "Pushed an empty keepalive commit — schedule clock reset."
